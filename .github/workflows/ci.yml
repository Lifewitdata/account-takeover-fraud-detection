name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Unit tests
        run: pytest tests/test_units.py
      - name: Rebuild every output from data/ and config/
        run: python -m ato.pipeline
      - name: Output invariants
        run: pytest tests/test_outputs.py
      - name: SQL parity (DuckDB mirror vs pandas features)
        run: pytest tests/test_sql_parity.py
      - name: Report drift between committed and regenerated outputs
        run: git diff --stat -- outputs/ || true
