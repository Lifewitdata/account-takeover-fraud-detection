[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "account-takeover-fraud-detection"
version = "2.0.0"
description = "Trust & Safety account-takeover and payment-fraud detection with an executable feature pipeline, confirmed-incident RCA, loss exposure model, rule-drift monitoring and a compliance control matrix."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "plotly>=5.20",
    "streamlit>=1.49",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "duckdb>=1.0",
    "sqlglot>=25.0",
]

[project.scripts]
ato-pipeline = "ato.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
